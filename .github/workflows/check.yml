name: テンプレートが起動するか

on:
  schedule:
    - cron: '0 21 * * *' # 毎朝 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template:
          - codespaces-railstutorial
          - codespaces-railstutorial-v8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: yasslab/${{ matrix.template }}
          path: template
      - run: ./check.sh template
      # 受講者より先に気づくため、失敗を Slack の #tutorial-error に知らせる。
      # PR（fork からのものを含む）は秘密を読めず、作者が Checks で見られるので知らせない
      - name: 失敗を Slack に知らせる
        if: failure() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: "Codespaces のテンプレート ${{ matrix.template }} の起動確認が失敗しました（${{ github.event_name }}）: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
